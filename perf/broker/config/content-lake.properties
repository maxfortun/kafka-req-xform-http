# Every record on perf topics goes to the lake; the record keeps only the lake's response (empty body, rec id headers).
enable=true
enable.values=(?i)^(true|false)$
uri=http://api:3000/checkin
topics.namePattern=^perf.*$
onException=error

httpClient.class=org.apache.kafka.common.requests.transform.AHC5HttpClient
httpClient.connectTimeout=5
httpClient.responseTimeout=30
httpClient.connTimeToLiveInSeconds=600
httpClient.maxConnPerRoute=256
httpClient.maxConnTotal=512
