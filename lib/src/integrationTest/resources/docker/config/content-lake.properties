# Off unless a record sets content-lake-broker-enable=true, so other tests skip the lake.
# uri points at a stub in the test JVM, so it is passed as -Dcontent-lake-uri.
enable=false
enable.values=(?i)^(true|false)$
enable.scopes=(?i)^(app|request)$

onException.scopes=(?i)^(app|request)$

headers.transientPattern=(?i)^(lineage).*$

retry.txnIdHeader=it-txn-id
retry.maxAttempts=3

httpClient.class=org.apache.kafka.common.requests.transform.AHC5HttpClient
httpClient.connectTimeout=5
httpClient.responseTimeout=5
